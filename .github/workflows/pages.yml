name: Deploy device dashboard to Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'supabase/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_BASE_PATH: /device-manager
      NEXT_PUBLIC_LOCAL_INVENTORY: 'false'
      NEXT_PUBLIC_SUPABASE_URL: https://yffjmvcherbenyxqfvkb.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_PfvAIatRVtnAyNO3ejK28w_lERX924N
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Exclude development inventory from public artifacts
        run: |
          if grep -rE 'F92WLYV9NR|CL4DY7FPWV' out --include='*.js'; then
            echo 'Development inventory unexpectedly included in static output.' >&2
            exit 1
          fi
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
